name: Build Android

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      upload_url:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.3)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: clients/android/baumagent
        run: flutter pub get

      # Decode keystore from GitHub secret (base64-encoded .jks file)
      # Required secrets: ANDROID_KEYSTORE, ANDROID_KEY_ALIAS,
      #                   ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD
      # ── Signing ────────────────────────────────────────────────────────────
      # Required secrets: ANDROID_KEYSTORE (base64 .jks), ANDROID_KEY_ALIAS,
      #                   ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD
      # See SIGNING.md for how to generate a keystore and encode it.

      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE != '' }}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode \
            > clients/android/baumagent/android/app/keystore.jks
          echo "Keystore written: $(wc -c < clients/android/baumagent/android/app/keystore.jks) bytes"

      - name: Write key.properties
        if: ${{ env.ANDROID_KEY_ALIAS != '' }}
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # No leading whitespace — property parser is whitespace-sensitive
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > clients/android/baumagent/android/key.properties

      - name: Build release APK
        working-directory: clients/android/baumagent
        run: |
          flutter build apk --release \
            --build-name=${{ inputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mv clients/android/baumagent/build/app/outputs/flutter-apk/app-release.apk \
             BaumAgent-${{ inputs.version }}.apk

      - name: Upload APK to release
        if: ${{ inputs.upload_url != '' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: BaumAgent-${{ inputs.version }}.apk
          asset_name: BaumAgent-${{ inputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: BaumAgent-${{ inputs.version }}.apk
          retention-days: 14
