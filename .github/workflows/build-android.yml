name: Build Android

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.3)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: clients/android/baumagent
        run: flutter pub get

      # Write local.properties so Gradle's settings.gradle can find flutter.sdk.
      # flutter pub get writes it on first run, but doing it explicitly is safer.
      - name: Write android/local.properties
        working-directory: clients/android/baumagent/android
        run: |
          FLUTTER_HOME="$(dirname "$(dirname "$(which flutter)")")"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            "$FLUTTER_HOME" > local.properties

      # Bootstrap the Gradle wrapper (gradlew + wrapper JAR) if not committed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Bootstrap Gradle wrapper
        working-directory: clients/android/baumagent/android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version=8.6 --distribution-type=bin
            chmod +x gradlew
          fi

      # Generate placeholder launcher icons (solid blue) for each mipmap density.
      # Replace with real icons via flutter_launcher_icons before publishing to Play Store.
      - name: Generate placeholder launcher icons
        working-directory: clients/android/baumagent
        run: |
          python3 - <<'PYEOF'
          import struct, zlib, os

          def make_png(size, r=33, g=150, b=243):
              raw = b''.join(b'\x00' + bytes([r, g, b]) * size for _ in range(size))
              idat = zlib.compress(raw)
              def chunk(tag, data):
                  crc = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', crc)
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', idat)
                      + chunk(b'IEND', b''))

          densities = [('mipmap-mdpi', 48), ('mipmap-hdpi', 72),
                       ('mipmap-xhdpi', 96), ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]
          for folder, size in densities:
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              png_path = f'{path}/ic_launcher.png'
              if not os.path.exists(png_path):
                  with open(png_path, 'wb') as f:
                      f.write(make_png(size))
                  print(f'Created {png_path} ({size}x{size})')
          PYEOF

      # ── Signing ────────────────────────────────────────────────────────────
      # Required secrets: ANDROID_KEYSTORE (base64 .jks), ANDROID_KEY_ALIAS,
      #                   ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD
      # See SIGNING.md for how to generate a keystore and encode it.

      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE != '' }}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode \
            > clients/android/baumagent/android/app/keystore.jks
          echo "Keystore written: $(wc -c < clients/android/baumagent/android/app/keystore.jks) bytes"

      - name: Write key.properties
        if: ${{ env.ANDROID_KEY_ALIAS != '' }}
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > clients/android/baumagent/android/key.properties

      - name: Diagnose Android project structure
        working-directory: clients/android/baumagent
        run: |
          echo "=== gradlew exists? ==="
          ls -la android/gradlew 2>/dev/null && echo "gradlew found" || echo "gradlew MISSING"
          echo "=== gradle wrapper jar? ==="
          ls -la android/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo "wrapper JAR MISSING"
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo "=== local.properties ==="
          cat android/local.properties 2>/dev/null || echo "local.properties MISSING"
          echo "=== MainActivity.kt ==="
          find android/app/src/main/kotlin -name "*.kt" 2>/dev/null | xargs ls -la 2>/dev/null || echo "No Kotlin files found"
          echo "=== Flutter version ==="
          flutter --version

      - name: Build release APK
        working-directory: clients/android/baumagent
        run: |
          flutter build apk --release --verbose \
            --build-name=${{ inputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mv clients/android/baumagent/build/app/outputs/flutter-apk/app-release.apk \
             BaumAgent-${{ inputs.version }}.apk

      # ── Upload ────────────────────────────────────────────────────────────

      - name: Upload APK to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "BaumAgent-${{ inputs.version }}.apk" \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: BaumAgent-${{ inputs.version }}.apk
          retention-days: 14
