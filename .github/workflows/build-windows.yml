name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.3)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        working-directory: clients/windows
        run: dotnet restore BaumAgentClient.sln

      - name: Build self-contained (win-x64)
        working-directory: clients/windows/BaumAgentClient
        run: |
          # dotnet publish silently drops resources.pri and XBF files for WinUI 3 apps.
          # Use msbuild /t:Build which runs the full Windows App SDK pipeline.
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * -requires Microsoft.Component.MSBuild `
              -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found via vswhere" }

          & $msbuild BaumAgentClient.csproj `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:Version=${{ inputs.version }} `
            "/p:FileVersion=${{ inputs.version }}.0" `
            /v:normal

          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== XamlCompiler output.json (if present) ==="
            Get-ChildItem -Recurse -Path obj -Filter output.json -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName }
            exit $LASTEXITCODE
          }

          # Copy full build output (XBF, PRI, DLLs) to workspace publish directory
          $binDir = "bin\x64\Release\net8.0-windows10.0.22621.0\win-x64"
          Copy-Item $binDir "${{ github.workspace }}\publish" -Recurse -Force
        shell: pwsh

      # Download Windows App Runtime bootstrapper into publish dir so
      # the NSIS installer can run it silently on target machines.
      - name: Download Windows App Runtime bootstrapper
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/windowsappruntimeinstall/2.0/x64" `
            -OutFile "${{ github.workspace }}\publish\WindowsAppRuntimeInstall.exe"
        shell: pwsh

      # ── Code signing ──────────────────────────────────────────────────────
      # Runs only when WINDOWS_CERT_PFX secret is set.
      # See SIGNING.md for how to generate and export a PFX certificate.

      - name: Locate signtool.exe
        if: ${{ env.WINDOWS_CERT_PFX != '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        id: signtool
        run: |
          $signtool = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          echo "path=$signtool" >> $env:GITHUB_OUTPUT
          Write-Host "signtool: $signtool"
        shell: pwsh

      - name: Import PFX certificate
        if: ${{ env.WINDOWS_CERT_PFX != '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        id: cert
        run: |
          $certPath = "${{ runner.temp }}\baumagent.pfx"
          [IO.File]::WriteAllBytes(
            $certPath,
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX)
          )
          echo "path=$certPath" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Sign published executable
        if: ${{ env.WINDOWS_CERT_PFX != '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & "${{ steps.signtool.outputs.path }}" sign `
            /fd SHA256 `
            /f "${{ steps.cert.outputs.path }}" `
            /p "$env:WINDOWS_CERT_PASSWORD" `
            /tr "http://timestamp.digicert.com" /td SHA256 `
            /d "BaumAgent" `
            "${{ github.workspace }}\publish\BaumAgentClient.exe"
          & "${{ steps.signtool.outputs.path }}" verify /pa `
            "${{ github.workspace }}\publish\BaumAgentClient.exe"
        shell: pwsh

      # ── NSIS installer ────────────────────────────────────────────────────

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build NSIS installer
        run: |
          Copy-Item -Recurse "${{ github.workspace }}\publish" `
            "${{ github.workspace }}\clients\windows\installer\publish"

          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DVERSION=${{ inputs.version }} `
            "${{ github.workspace }}\clients\windows\installer\installer.nsi"

          # NSIS OutFile is relative to the script directory
          Move-Item `
            "${{ github.workspace }}\clients\windows\installer\BaumAgent-Setup-${{ inputs.version }}.exe" `
            "${{ github.workspace }}\BaumAgent-Setup-${{ inputs.version }}.exe"
        shell: pwsh

      - name: Sign installer
        if: ${{ env.WINDOWS_CERT_PFX != '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & "${{ steps.signtool.outputs.path }}" sign `
            /fd SHA256 `
            /f "${{ steps.cert.outputs.path }}" `
            /p "$env:WINDOWS_CERT_PASSWORD" `
            /tr "http://timestamp.digicert.com" /td SHA256 `
            /d "BaumAgent Installer" `
            "${{ github.workspace }}\BaumAgent-Setup-${{ inputs.version }}.exe"
          & "${{ steps.signtool.outputs.path }}" verify /pa `
            "${{ github.workspace }}\BaumAgent-Setup-${{ inputs.version }}.exe"
        shell: pwsh

      # ── Upload ────────────────────────────────────────────────────────────

      - name: Upload installer to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "${{ github.workspace }}\BaumAgent-Setup-${{ inputs.version }}.exe" `
            --clobber `
            --repo "${{ github.repository }}"
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: BaumAgent-Setup-${{ inputs.version }}.exe
          retention-days: 14
