name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      upload_url:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.3)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        working-directory: clients/windows
        run: dotnet restore BaumAgentClient.sln

      - name: Publish self-contained (win-x64)
        working-directory: clients/windows/BaumAgentClient
        run: |
          dotnet publish BaumAgentClient.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ inputs.version }} `
            -p:FileVersion=${{ inputs.version }}.0 `
            -o "${{ github.workspace }}\publish"
        shell: pwsh

      # Download Windows App Runtime bootstrapper into publish dir so
      # the NSIS installer can run it silently on target machines.
      - name: Download Windows App Runtime bootstrapper
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/windowsappruntimeinstall/1.5/x64" `
            -OutFile "${{ github.workspace }}\publish\WindowsAppRuntimeInstall.exe"
        shell: pwsh

      # ── Code signing ──────────────────────────────────────────────────────
      # Runs only when WINDOWS_CERT_PFX secret is set.
      # See SIGNING.md for how to generate and export a PFX certificate.

      - name: Locate signtool.exe
        if: ${{ env.WINDOWS_CERT_PFX != '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        id: signtool
        run: |
          # Search all installed Windows SDK versions; pick the newest x64 signtool.
          $signtool = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          echo "path=$signtool" >> $env:GITHUB_OUTPUT
          Write-Host "signtool: $signtool"
        shell: pwsh

      - name: Import PFX certificate
        if: ${{ env.WINDOWS_CERT_PFX != '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        id: cert
        run: |
          $certPath = "${{ runner.temp }}\baumagent.pfx"
          [IO.File]::WriteAllBytes(
            $certPath,
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX)
          )
          echo "path=$certPath" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Sign published executable
        if: ${{ env.WINDOWS_CERT_PFX != '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & "${{ steps.signtool.outputs.path }}" sign `
            /fd SHA256 `
            /f "${{ steps.cert.outputs.path }}" `
            /p "$env:WINDOWS_CERT_PASSWORD" `
            /tr "http://timestamp.digicert.com" /td SHA256 `
            /d "BaumAgent" `
            "${{ github.workspace }}\publish\BaumAgentClient.exe"
          # Verify
          & "${{ steps.signtool.outputs.path }}" verify /pa `
            "${{ github.workspace }}\publish\BaumAgentClient.exe"
        shell: pwsh

      # ── NSIS installer ────────────────────────────────────────────────────

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build NSIS installer
        run: |
          Copy-Item -Recurse "${{ github.workspace }}\publish" `
            "${{ github.workspace }}\clients\windows\installer\publish"

          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DVERSION=${{ inputs.version }} `
            "${{ github.workspace }}\clients\windows\installer\installer.nsi"

          Move-Item "BaumAgent-Setup-${{ inputs.version }}.exe" "${{ github.workspace }}\"
        shell: pwsh

      - name: Sign installer
        if: ${{ env.WINDOWS_CERT_PFX != '' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & "${{ steps.signtool.outputs.path }}" sign `
            /fd SHA256 `
            /f "${{ steps.cert.outputs.path }}" `
            /p "$env:WINDOWS_CERT_PASSWORD" `
            /tr "http://timestamp.digicert.com" /td SHA256 `
            /d "BaumAgent Installer" `
            "${{ github.workspace }}\BaumAgent-Setup-${{ inputs.version }}.exe"
          & "${{ steps.signtool.outputs.path }}" verify /pa `
            "${{ github.workspace }}\BaumAgent-Setup-${{ inputs.version }}.exe"
        shell: pwsh

      # ── Upload ────────────────────────────────────────────────────────────

      - name: Upload installer to release
        if: ${{ inputs.upload_url != '' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ github.workspace }}/BaumAgent-Setup-${{ inputs.version }}.exe
          asset_name: BaumAgent-Setup-${{ inputs.version }}.exe
          asset_content_type: application/octet-stream

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: BaumAgent-Setup-${{ inputs.version }}.exe
          retention-days: 14
