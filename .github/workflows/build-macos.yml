name: Build macOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.3)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14        # Apple Silicon runner (arm64)
    steps:
      - uses: actions/checkout@v4

      # ── Code signing ──────────────────────────────────────────────────────
      # Runs only when MACOS_CERT_P12 secret is set.
      # See SIGNING.md for how to export your Developer ID certificate.
      # Notarisation runs additionally when MACOS_NOTARIZE_APPLE_ID is set.

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" \
            | head -1 \
            | sed -E 's/.*"([^"]+)".*/\1/')

          if [ -z "$IDENTITY" ]; then
            echo "::warning::No 'Developer ID Application' identity found — falling back to ad-hoc signing"
            IDENTITY="-"
          else
            echo "Found signing identity: $IDENTITY"
          fi

          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Patch version in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString ${{ inputs.version }}" \
            clients/macos/BaumAgent/BaumAgent/Info.plist

      - name: Build .app bundle and DMG
        working-directory: clients/macos
        env:
          VERSION: ${{ inputs.version }}
          SIGN_IDENTITY: ${{ env.SIGN_IDENTITY || '-' }}
        run: |
          chmod +x build-dmg.sh
          ./build-dmg.sh

      # ── Notarisation ──────────────────────────────────────────────────────
      # Requires: MACOS_NOTARIZE_APPLE_ID, MACOS_NOTARIZE_TEAM_ID,
      #           MACOS_NOTARIZE_APP_PASSWORD (app-specific password).
      # Only runs when MACOS_CERT_P12 is also set (can't notarise unsigned).

      - name: Notarise DMG
        if: ${{ env.MACOS_CERT_P12 != '' && env.MACOS_NOTARIZE_APPLE_ID != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          MACOS_NOTARIZE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit \
            "clients/macos/build/BaumAgent-${{ inputs.version }}.dmg" \
            --apple-id "$MACOS_NOTARIZE_APPLE_ID" \
            --team-id "$MACOS_NOTARIZE_TEAM_ID" \
            --password "$MACOS_NOTARIZE_APP_PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple \
            "clients/macos/build/BaumAgent-${{ inputs.version }}.dmg"
          echo "✔ Notarised and stapled"

      # ── Upload ────────────────────────────────────────────────────────────

      - name: Upload DMG to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "clients/macos/build/BaumAgent-${{ inputs.version }}.dmg" \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: clients/macos/build/BaumAgent-${{ inputs.version }}.dmg
          retention-days: 14
