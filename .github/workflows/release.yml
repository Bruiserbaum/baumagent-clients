name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # ── Create the GitHub release ─────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' \
            "## BaumAgent $GITHUB_REF_NAME" \
            "" \
            "### Downloads" \
            "| Platform | File |" \
            "|----------|------|" \
            "| Windows  | \`BaumAgent-Setup-${VERSION}.exe\` |" \
            "| Android  | \`BaumAgent-${VERSION}.apk\` |" \
            "| macOS    | \`BaumAgent-${VERSION}.dmg\` |" \
            "" \
            "> **Windows**: Requires Windows 10 1809+ (x64). The installer includes .NET 8 and installs the Windows App Runtime automatically." \
            "> **Android**: Enable *Install from unknown sources* for your browser or file manager, then open the APK." \
            "> **macOS**: Drag BaumAgent.app to Applications. macOS 14 (Sonoma) or later required." \
            "" \
            "### Auto-update" \
            "All clients check for updates on launch and notify you in-app." \
            > "$RUNNER_TEMP/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BaumAgent $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --draft=false \
            --prerelease=false \
          || echo "Release already exists — continuing with asset uploads"

  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows installer
    needs: create-release
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets: inherit

  # ── Android ───────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    needs: create-release
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets: inherit

  # ── macOS ─────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    needs: create-release
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets: inherit
