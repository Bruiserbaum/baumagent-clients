name: baumagent
description: BaumAgent native Android client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP + WebSocket
  http: ^1.2.1
  web_socket_channel: ^2.4.5

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Secure storage (Keystore/Keychain)
  flutter_secure_storage: ^9.0.0

  # Firebase Cloud Messaging
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.4

  # Voice dictation
  speech_to_text: ^6.6.2

  # QR scanner for pairing
  mobile_scanner: ^5.1.0

  # File download / share
  path_provider: ^2.1.3
  open_filex: ^4.3.4

  # Version info for auto-updater
  package_info_plus: ^8.0.2

  # Misc UI
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
