plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    // com.google.gms.google-services is omitted until FCM is configured.
    // To enable: add the plugin here, add google-services.json to android/app/,
    // and uncomment firebase_core + firebase_messaging in pubspec.yaml.
}

// Load keystore credentials from android/key.properties (not committed to git).
// In CI the file is written by the build workflow from GitHub secrets.
// For local development copy android/key.properties.example and fill in your values.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("key.properties")
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.baumagent.client"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        release {
            keyAlias     keystoreProps["keyAlias"]     ?: ""
            keyPassword  keystoreProps["keyPassword"]  ?: ""
            storeFile    keystoreProps["storeFile"]    ? file(keystoreProps["storeFile"]) : null
            storePassword keystoreProps["storePassword"] ?: ""
        }
    }

    defaultConfig {
        applicationId "com.baumagent.client"
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // Use release keystore when available; fall back to debug for unsigned local builds.
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
