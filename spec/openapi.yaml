openapi: "3.1.0"

info:
  title: BaumAgent API
  version: "1.0.0"
  description: |
    REST API for BaumAgent — a self-hosted AI task manager.

    ## Authentication

    Native clients authenticate with a long-lived API token obtained via the QR
    pairing flow. Send the token as a Bearer credential on every request:

    ```
    Authorization: Bearer bat_<64-hex-chars>
    ```

    The web UI authenticates via Authentik forward-auth headers injected by the
    reverse proxy — those headers are irrelevant to native clients.

    ## Pairing flow

    1. User opens the native client and enters the BaumAgent URL.
    2. Client displays "Scan QR to connect" — or user pastes the code manually.
    3. Authenticated web-UI user navigates to Settings → Pair New Device.
       The UI calls `POST /api/auth/pair/initiate` and renders the returned
       `pair_url` as a QR code. The code expires after `expires_in` seconds.
    4. Native client scans / user pastes → client calls
       `POST /api/auth/pair/complete` → receives `token`.
    5. Client stores `token` in platform-native secure storage and uses it
       for all subsequent requests.

servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: https
        enum: [http, https]
      host:
        default: baumagent.example.com
        description: Your BaumAgent instance hostname (set during first-launch pairing)

security:
  - bearerAuth: []

# ---------------------------------------------------------------------------
# Security schemes
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API token obtained via QR pairing. Format: bat_<64 hex chars>"

  # ---------------------------------------------------------------------------
  # Reusable schemas
  # ---------------------------------------------------------------------------
  schemas:

    # --- Auth ---

    PairInitiateResponse:
      type: object
      required: [code, expires_in, pair_url]
      properties:
        code:
          type: string
          description: One-time pairing code (URL-safe base64, ~22 chars)
          example: "3gT8xKqZ2mP5vRnYoWdAeL"
        expires_in:
          type: integer
          description: Seconds until the code expires (default 300)
          example: 300
        pair_url:
          type: string
          description: |
            Deep-link URL encoding the server address and pairing code.
            Format: `baumagent://pair?url=<server_url>&code=<code>`
            Render this as a QR code in the web UI.
          example: "baumagent://pair?url=https://baumagent.example.com&code=3gT8xKqZ2mP5vRnYoWdAeL"

    PairCompleteRequest:
      type: object
      required: [code, device_name]
      properties:
        code:
          type: string
          description: Pairing code from the QR / manual entry
          example: "3gT8xKqZ2mP5vRnYoWdAeL"
        device_name:
          type: string
          description: Human-readable label for this device shown in token management
          example: "My MacBook Pro"

    PairCompleteResponse:
      type: object
      required: [token, token_id, user_id, user_email, user_display_name]
      properties:
        token:
          type: string
          description: |
            The API token. **Store immediately in secure storage — it is never
            returned again.**
          example: "bat_a3f8e2c1..."
        token_id:
          type: string
          format: uuid
          description: ID of the token record (used to revoke it)
        user_id:
          type: string
          format: uuid
        user_email:
          type: string
          format: email
        user_display_name:
          type: string

    ApiToken:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Device label
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true

    # --- Push ---

    PushTokenRegister:
      type: object
      required: [platform, token]
      properties:
        platform:
          type: string
          enum: [apns, fcm, wns]
          description: "apns = Mac/iOS, fcm = Android, wns = Windows"
        token:
          type: string
          description: Device push token from the platform SDK
        device_label:
          type: string
          default: ""

    PushToken:
      type: object
      required: [id, platform, device_label, created_at]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [apns, fcm, wns]
        device_label:
          type: string
        created_at:
          type: string
          format: date-time

    # --- Tasks ---

    TaskStatus:
      type: string
      enum: [queued, running, complete, failed, cancelled]

    Task:
      type: object
      required: [id, created_at, updated_at, description, repo_url, base_branch,
                 llm_backend, llm_model, status, log, task_type, extra_data]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        description:
          type: string
          description: Natural-language task description (the prompt)
        repo_url:
          type: string
          description: GitHub repository URL (empty string for non-code tasks)
        base_branch:
          type: string
          default: main
        llm_backend:
          type: string
          enum: [anthropic, openai, ollama]
        llm_model:
          type: string
          example: claude-opus-4-6
        status:
          $ref: "#/components/schemas/TaskStatus"
        rq_job_id:
          type: string
          nullable: true
        branch_name:
          type: string
          nullable: true
          description: Git branch created by the agent (code tasks)
        pr_url:
          type: string
          nullable: true
          description: GitHub pull request URL (code tasks, on completion)
        pr_number:
          type: integer
          nullable: true
        commit_sha:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        log:
          type: string
          description: |
            Accumulated agent log text. For live streaming, connect to the
            WebSocket endpoint instead of polling this field.
        task_type:
          type: string
          enum: [code, research, deep_research, structured_document]
        output_file:
          type: string
          nullable: true
          description: Server-side path to the generated output file
        output_format:
          type: string
          nullable: true
        user_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        extra_data:
          type: string
          description: JSON blob of task-type-specific options
          default: "{}"
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true

    TaskList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: integer
          description: Total number of tasks matching the filter
        page:
          type: integer
        page_size:
          type: integer

    # --- Projects ---

    Project:
      type: object
      required: [id, user_id, name, color, position, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Hex colour string, e.g. "#3b82f6"
          example: "#3b82f6"
        position:
          type: integer
          description: Display order (ascending)
        created_at:
          type: string
          format: date-time

    # --- Settings ---

    PortalSettings:
      type: object
      properties:
        default_llm_backend:
          type: string
          enum: [anthropic, openai, ollama]
        default_llm_model:
          type: string
        chat_backend:
          type: string
        chat_model:
          type: string
        research_backend:
          type: string
        research_model:
          type: string
        code_backend:
          type: string
        code_model:
          type: string

    ModelsResponse:
      type: object
      properties:
        anthropic:
          type: array
          items:
            type: string
        openai:
          type: array
          items:
            type: string
        ollama:
          type: array
          items:
            type: string

    # --- Queue ---

    QueueStatus:
      type: object
      required: [queued, running]
      properties:
        queued:
          type: array
          items:
            type: string
            format: uuid
          description: Task IDs currently waiting in the queue
        running:
          type: array
          items:
            type: string
            format: uuid
          description: Task IDs currently being executed

    # --- Health ---

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    # --- Git Nexus ---

    GitNexusIndexStatus:
      type: string
      enum: [indexed, indexing, pending, error, never]
      description: |
        Current state of the full-text / vector index for this repository.
        - `indexed`  — index is current
        - `indexing` — a re-index is in progress
        - `pending`  — queued but not started yet
        - `error`    — last index run failed (see `error_message`)
        - `never`    — repository has never been indexed

    GitNexusPullStatus:
      type: string
      enum: [ok, pulling, error]
      nullable: true
      description: |
        Result of the most recent `git pull` against the upstream remote.
        - `ok`      — pull succeeded and working tree is up to date
        - `pulling` — a pull is currently in progress
        - `error`   — last pull failed (see `error_message`)

    GitNexusRepo:
      type: object
      required: [id, repo_url, default_branch, index_status]
      description: |
        A repository registered with the Git Nexus indexing subsystem.
        The native client Settings page uses this to display indexed-repo
        status and offer manual re-index / pull triggers.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this Nexus repo record
        repo_url:
          type: string
          description: Full HTTPS clone URL of the repository
          example: "https://github.com/Bruiserbaum/baumagent-clients"
        default_branch:
          type: string
          description: Branch that is indexed (usually `main` or `master`)
          default: main
        index_status:
          $ref: "#/components/schemas/GitNexusIndexStatus"
        pull_status:
          $ref: "#/components/schemas/GitNexusPullStatus"
        last_indexed_at:
          type: string
          format: date-time
          nullable: true
          description: When the index was last successfully built
        last_pulled_at:
          type: string
          format: date-time
          nullable: true
          description: When the working tree was last successfully updated
        file_count:
          type: integer
          nullable: true
          description: Number of files currently in the index
        error_message:
          type: string
          nullable: true
          description: Last error from indexing or pulling, if any

    FixTaskResponse:
      type: object
      required: [task_id, repo_url]
      properties:
        task_id:
          type: string
          format: uuid
        repo_url:
          type: string

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ── Health ────────────────────────────────────────────────────────────────

  /api/health:
    get:
      operationId: getHealth
      summary: Health check (unauthenticated)
      security: []
      tags: [Health]
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ── Auth ──────────────────────────────────────────────────────────────────

  /api/auth/pair/initiate:
    post:
      operationId: initiatePairing
      summary: Start a new QR pairing session (web UI only)
      tags: [Auth]
      responses:
        "200":
          description: Pairing session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairInitiateResponse"

  /api/auth/pair/complete:
    post:
      operationId: completePairing
      summary: Exchange pairing code for an API token (native client)
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairCompleteRequest"
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairCompleteResponse"
        "400":
          description: Invalid or expired code

  /api/auth/tokens:
    get:
      operationId: listTokens
      summary: List all API tokens for the current user
      tags: [Auth]
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"

  /api/auth/tokens/{tokenId}:
    delete:
      operationId: revokeToken
      summary: Revoke (delete) an API token
      tags: [Auth]
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Token revoked
        "404":
          description: Token not found

  # ── Push ──────────────────────────────────────────────────────────────────

  /api/push/register:
    post:
      operationId: registerPushToken
      summary: Register a platform push token
      tags: [Push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRegister"
      responses:
        "200":
          description: Token registered

  # ── Tasks ─────────────────────────────────────────────────────────────────

  /api/tasks:
    get:
      operationId: listTasks
      summary: List tasks (paginated)
      tags: [Tasks]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"

    post:
      operationId: createTask
      summary: Create a new task
      tags: [Tasks]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [description, task_type, llm_backend, llm_model]
              properties:
                description:
                  type: string
                task_type:
                  type: string
                  enum: [code, research, deep_research, structured_document]
                llm_backend:
                  type: string
                  enum: [anthropic, openai, ollama]
                llm_model:
                  type: string
                repo_url:
                  type: string
                base_branch:
                  type: string
                  default: main
                project_id:
                  type: string
                  format: uuid
                  nullable: true
                delivery_mode:
                  type: string
                  enum: [document, markdown, pdf]
                  nullable: true
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /api/tasks/{taskId}:
    get:
      operationId: getTask
      summary: Get a single task
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      summary: Delete a task
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted

  /api/tasks/{taskId}/retry:
    post:
      operationId: retryTask
      summary: Retry a failed / cancelled task
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: New task object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /api/tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      summary: Cancel a queued or running task
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Cancelled

  /api/tasks/{taskId}/exports:
    get:
      operationId: listExports
      summary: List downloadable output files for a task
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    filename:
                      type: string
                    size_bytes:
                      type: integer
                    mime_type:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    download_url:
                      type: string

  /api/tasks/{taskId}/download:
    get:
      operationId: downloadExport
      summary: Download the primary output file for a task
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ── Queue ─────────────────────────────────────────────────────────────────

  /api/queue:
    get:
      operationId: getQueue
      summary: Get current queue state (queued and running task IDs)
      tags: [Queue]
      responses:
        "200":
          description: Queue status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"

  # ── Projects ──────────────────────────────────────────────────────────────

  /api/projects:
    get:
      operationId: listProjects
      summary: List all projects for the current user
      tags: [Projects]
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  # ── Settings ──────────────────────────────────────────────────────────────

  /api/settings:
    get:
      operationId: getSettings
      summary: Get portal / LLM settings
      tags: [Settings]
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSettings"

  /api/models:
    get:
      operationId: getModels
      summary: Get available LLM models per backend
      tags: [Settings]
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"

  # ── Git Nexus ─────────────────────────────────────────────────────────────

  /api/gitnexus/repos:
    get:
      operationId: listNexusRepos
      summary: List all repositories tracked by the Git Nexus indexer
      description: |
        Returns every repository that has been registered with the Git Nexus
        subsystem, together with its current index status and last-pull status.
        Use this in the Settings page to give users visibility into which
        repos are indexed, which are pending, and which have errors.
      tags: [GitNexus]
      responses:
        "200":
          description: Repository list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitNexusRepo"

  /api/gitnexus/repos/{repoId}/reindex:
    post:
      operationId: triggerNexusReindex
      summary: Trigger a full re-index of a specific repository
      tags: [GitNexus]
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Re-index job accepted

  /api/gitnexus/repos/{repoId}/pull:
    post:
      operationId: triggerNexusPull
      summary: Trigger a git pull for a specific repository
      tags: [GitNexus]
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Pull job accepted

  /api/gitnexus/fix:
    post:
      operationId: fixHealthScan
      summary: Create a fix-task from a completed health-scan task
      tags: [GitNexus]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_task_id]
              properties:
                source_task_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Fix task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixTaskResponse"
